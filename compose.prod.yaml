# Production stack behind the VPS's shared Traefik (TLS and the http->https redirect are handled there).
# Needs a .env next to this file; see docs/deploy.md.
name: notarik-app

services:
  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.prod.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./apps/api
    restart: "no"
    command: ["python", "-m", "app.db.migrate", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:${APP_USER_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-authenticated}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      traefik.enable: "true"
      traefik.docker.network: notarik-app_default
      traefik.http.routers.notarik-app-api.rule: Host(`${API_HOST}`)
      traefik.http.routers.notarik-app-api.entrypoints: websecure
      traefik.http.routers.notarik-app-api.tls.certresolver: letsencrypt
      traefik.http.services.notarik-app-api.loadbalancer.server.port: "8000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_SITE_URL: https://${WEB_HOST}
        NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    labels:
      traefik.enable: "true"
      traefik.docker.network: notarik-app_default
      traefik.http.routers.notarik-app-web.rule: Host(`${WEB_HOST}`)
      traefik.http.routers.notarik-app-web.entrypoints: websecure
      traefik.http.routers.notarik-app-web.tls.certresolver: letsencrypt
      traefik.http.services.notarik-app-web.loadbalancer.server.port: "3000"

volumes:
  pgdata:
