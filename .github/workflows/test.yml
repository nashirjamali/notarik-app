name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_USER_PASSWORD: postgres
      JWT_SECRET: test-jwt-secret-for-ci-only-not-prod
      JWT_AUDIENCE: authenticated
      DATABASE_URL: postgresql+psycopg://app_user:postgres@127.0.0.1:5432/notarik_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/notarik_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/notarik_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --frozen
      - name: Test
        run: make test

  mobile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_USER_PASSWORD: postgres
      JWT_SECRET: test-jwt-secret-for-ci-only-not-prod
      JWT_AUDIENCE: authenticated
      DATABASE_URL: postgresql+psycopg://app_user:postgres@127.0.0.1:5432/notarik_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/notarik_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/notarik_test
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8000
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen
      - name: Prepare the test database
        working-directory: apps/api
        run: uv run python -c "from tests.support import prepare_test_database; prepare_test_database()"
      - name: Install app dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Lint
        working-directory: apps/mobile
        run: npm run lint
      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/mobile
        run: npm test -- --watchman=false
      - name: Export the web build
        working-directory: apps/mobile
        run: npx expo export --platform web
      - name: Install Playwright
        working-directory: apps/mobile
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        working-directory: apps/mobile
        run: npx playwright test

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_USER_PASSWORD: postgres
      JWT_SECRET: test-jwt-secret-for-ci-only-not-prod
      JWT_AUDIENCE: authenticated
      DATABASE_URL: postgresql+psycopg://app_user:postgres@127.0.0.1:5432/notarik_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/notarik_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/notarik_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen
      - name: Prepare the test database
        working-directory: apps/api
        run: uv run python -c "from tests.support import prepare_test_database; prepare_test_database()"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/web
        run: npm test
      - name: Install Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        working-directory: apps/web
        run: npx playwright test
